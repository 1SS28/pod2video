[project]
name = "pod2video"
version = "0.1.0"
description = "Turn an audio-only podcast into short vertical video clips with Magic Hour Talking Photo."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11,<2",
    "feedparser>=6.0.11",
    "httpx>=0.27",
    "pillow>=10",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
pod2video = "pod2video.cli:app"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "pod2video"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
